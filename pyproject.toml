[project]
name = "sips"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "theyashwanthsai", email = "taddishetty34@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gguf>=0.19.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "regex>=2026.9.29",
    "scipy>=1.17.1",
]

[tool.uv.build-backend]
module-name = ["sips", "birl", "envs", "evaluation", "common", "mistakes", "openended", "clips", "llms"]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
